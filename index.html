<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Comer para Gastar</title>
  </head>

  <body>
    <header class="header">
      <div class="logo">
        <img src="logo oficial.png" alt="Logo Comer para Gastar" />
      </div>

      <nav class="menu">
        <a href="#" class="ativo">Início</a>
        <a href="#">Sobre nós</a>
        <a href="#">Dicas & conteúdos</a>
        <a href="#">Contato</a>
      </nav>

      <button class="entrar">Entrar</button>
    </header>
    <h1 class="name5">Comer para Gastar</h1>

    <div class="folha-centro">
      <img src="folhinha.png" alt="Folha decorativa" />
    </div>

    <div class="texto-centro">
      <p>
        Entenda a relação entre a
        <strong class="text1">alimentação e o gasto calórico.</strong>
        <br />

        Descubra quando você
        <strong class="text1">consome</strong>, quanto precisa
        <strong class="text1">gastar</strong>
        e como
        <br />

        equilibrar sua rotina de forma
        <strong class="text1">simples, saudável e consciente</strong>
      </p>
    </div>
    <section class="conteudo-imagens">
      <section class="gastos-caloricos">
        <img src="gastos caloricos.png" alt="Exemplos de Gastos Calóricos" />
      </section>

      <img class="img-lateral" src="lasca de parede.png" alt="Imagem lateral" />
    </section>

    <section class="cta-final">
      <div class="cta-esquerda">
        <div class="icone-folha">
          <img src="folha-fim-site.png" alt="Folha" />
        </div>

        <div class="texto-cta">
          <p>Pequenas escolhas hoje,</p>
          <h2>grandes transformações amanhã.</h2>
        </div>
      </div>

      <button class="botao-cta">Comece agora →</button>
    </section>
  </body>
</html>
